name: Cargo no downgrades
description: >-
  Fails a pull request whose Cargo.lock pins any package below the version
  the base branch locks. Catches a branch cut before a dependency bump on
  the base branch that then merges the old pin back in.

inputs:
  base:
    description: The branch to compare against. Defaults to the pull request's base branch.
    required: false
    default: ${{ github.base_ref }}
  lockfile:
    description: Path of the lock file, relative to the repository root.
    required: false
    default: Cargo.lock

runs:
  using: composite
  steps:
    - name: Fetch the base branch's lock file
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        LOCKFILE: ${{ inputs.lockfile }}
      run: |
        git fetch --depth=1 origin "$BASE"
        git show "origin/$BASE:$LOCKFILE" > "$RUNNER_TEMP/base.lock"
    - name: Compare
      shell: bash
      env:
        LOCKFILE: ${{ inputs.lockfile }}
      run: python3 "$GITHUB_ACTION_PATH/no_downgrades.py" "$RUNNER_TEMP/base.lock" "$LOCKFILE"
