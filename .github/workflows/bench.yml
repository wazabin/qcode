name: Bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Times the lifting hot path (sleigh/benches/lift.rs) on every push and pull
  # request. A pull request is compared against its base: the base is benched
  # first in the same job, on the same runner, and Criterion reports the change
  # per instruction. Shared runners are noisy, so the job reports and never
  # fails on a regression; read the table, in the job summary and in a sticky
  # comment on the pull request, and rerun locally with
  # `--save-baseline`/`--baseline` before believing a small difference.
  lift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check out the base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Bench the base
        id: base
        # The base has the bench only once it is on main; a pull request that
        # adds it is benched on its own.
        if: github.event_name == 'pull_request' && hashFiles('base/sleigh/benches/lift.rs') != ''
        working-directory: base
        # The base builds in its own target directory: shared with the head's,
        # cargo reused the base's artifacts for the head and compared the base
        # with itself. Only Criterion's store is shared, so the head's run
        # finds the baseline.
        env:
          CRITERION_HOME: ${{ github.workspace }}/target/criterion
        run: |
          cargo bench -p wazabin-qcode-sleigh --bench lift -- --noplot --save-baseline base
          echo "compare=--baseline base" >> "$GITHUB_OUTPUT"

      - name: Bench
        # bash for pipefail, so the tee does not hide a failed bench.
        shell: bash
        env:
          CRITERION_HOME: ${{ github.workspace }}/target/criterion
        run: |
          cargo bench -p wazabin-qcode-sleigh --bench lift -- --noplot ${{ steps.base.outputs.compare }} \
            | tee bench.txt

      - name: Tabulate
        if: always()
        run: |
          {
            echo '## Lift bench'
            if [ -n "${{ steps.base.outputs.compare }}" ]; then
              echo "Head \`${{ github.event.pull_request.head.sha }}\` against base \`${{ github.event.pull_request.base.sha }}\`."
            fi
            echo
            python3 .github/scripts/bench-table.py < bench.txt
          } > bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lift-bench
          path: bench.md
