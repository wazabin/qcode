name: Pages

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "web/**"
      - "core/**"
      - "parser/**"
      - "sleigh/**"
      - "macro/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,mdbook
      - name: Check the reference examples
        run: cargo test -p wazabin-qcode --test langref && cargo test -p qcode-langref
      - name: Build the site
        run: book/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
