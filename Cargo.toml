[workspace]
members = ["core", "emulator", "jit", "macro", "parser", "passes", "sleigh", "vm"]
exclude = ["analysis"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wazabin/qcode"
homepage = "https://github.com/wazabin/qcode"

[workspace.dependencies]
wazabin-binary = { version = "0.1.0", path = "../wazabin-binary" }
cabi = { version = "0.1.0", path = "../wazabin-cabi" }
jstd = { package = "wazabin-jstd", version = "0.1.0", path = "../wazabin-jstd" }
pcode-types = { package = "wazabin-pcode", version = "0.1.0", path = "../wazabin-pcode" }
qcode = { version = "0.1.0", path = "core" }
qcode_analysis = { version = "0.1.0", path = "analysis" }
qcode_emulator = { version = "0.1.0", path = "emulator" }
qcode_jit = { version = "0.1.0", path = "jit" }
qcode_passes = { version = "0.1.0", path = "passes" }
qcode_vm = { version = "0.1.0", path = "vm" }
wazabin-qcode-macro = { version = "0.1.0", path = "macro" }
wazabin-qcode-parser = { version = "0.1.0", path = "parser" }

bincode = { version = "2", features = ["serde"] }
clang = { version = "2", features = ["clang_10_0"] }
cpp_demangle = "0.5"
env_logger = "0.11"
inventory = "0.3"
log = "0.4"
pest = "2.8.6"
pest_derive = "2.8.6"
pollster = "0.4"
rumba-core = "=1.0.0"
rustc-hash = "2"
rustc_apfloat = "0.2.3"
serde = { version = "1", features = ["derive"] }
smallvec = "1"
toml = "1"

# The published crates depend on the official `rustc_apfloat`. Until
# https://github.com/rust-lang/rustc_apfloat/pull/37 (overflow is not signalled
# when rounding delivers the largest finite value) is released, local builds and
# CI take the fix from the fork. `[patch]` applies to this workspace only: it is
# not recorded in published packages and never reaches downstream consumers.
[patch.crates-io]
rustc_apfloat = { git = "https://github.com/Garfield1002/rustc_apfloat.git", rev = "9a4a688bc8f2741c5bd43df79c7061ef63142122" }
