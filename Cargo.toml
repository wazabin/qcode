[workspace]
members = ["core", "analysis", "emulator", "macro", "parser", "sleigh"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/wazabin/qcode"
homepage = "https://github.com/wazabin/qcode"

[workspace.dependencies]
wazabin-binary = { version = "0.1.0", path = "../wazabin-binary" }
cabi = { version = "0.1.0", path = "../wazabin-cabi" }
jstd = { package = "wazabin-jstd", version = "0.1.0", path = "../wazabin-jstd" }
pcode-types = { package = "wazabin-pcode", version = "0.1.0", path = "../wazabin-pcode" }
qcode = { version = "0.1.0", path = "core" }
qcode_analysis = { version = "0.1.0", path = "analysis" }
qcode_emulator = { version = "0.1.0", path = "emulator" }
wazabin-qcode-macro = { version = "0.1.0", path = "macro" }
wazabin-qcode-parser = { version = "0.1.0", path = "parser" }

bincode = { version = "2", features = ["serde"] }
clang = { version = "2", features = ["clang_10_0"] }
cpp_demangle = "0.5"
env_logger = "0.11"
inventory = "0.3"
log = "0.4"
pest = "2.8.6"
pest_derive = "2.8.6"
pollster = "0.4"
rumba-core = "=1.0.0"
rustc-hash = "2"
rustc_apfloat = { git = "https://github.com/Garfield1002/rustc_apfloat.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
smallvec = "1"
toml = "1"
