[package]
name = "qcode_analysis"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Optimization passes for the qcode IR: GVN, DCE, dead-store elimination, alias analysis"
repository.workspace = true

[features]
# Forward to cabi's Win32 prototype tables (mingw-w64). Off by default; see cabi.
win32 = ["cabi/win32"]

[dependencies]
jstd.workspace = true
binfmt.workspace = true
qcode.workspace = true
cabi.workspace = true
serde.workspace = true
bincode.workspace = true
toml.workspace = true
cpp_demangle.workspace = true
inventory.workspace = true
log.workspace = true
# Fast non-cryptographic hasher for internal int-keyed maps (ValueId/BlockId/...).
# Profiling showed ~⅓ of analysis CPU was SipHash; FxHashMap also makes map
# iteration order deterministic (std RandomState reseeds per process).
rustc-hash.workspace = true
pollster.workspace = true
# Pure-function emulation in constant propagation runs the callee body.
qcode_emulator.workspace = true
# MBA solver backing the `mba_simplify` de-obfuscation pass.
rumba-core.workspace = true

[build-dependencies]
serde.workspace = true
bincode.workspace = true
# Parse the TEB/PEB layout from `src/teb.h` at build time (same libclang dep cabi uses).
clang.workspace = true

[dev-dependencies]
qcode = { workspace = true, features = ["testing"] }
qcode_macro.workspace = true
env_logger.workspace = true

[[example]]
name = "qcode-pass"
path = "examples/qcode_pass.rs"
