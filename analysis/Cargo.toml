[package]
name = "qcode_analysis"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Optimization passes for the qcode IR: GVN, DCE, dead-store elimination, alias analysis"
repository.workspace = true

[dependencies]
jstd.workspace = true
qcode.workspace = true
cabi.workspace = true
serde.workspace = true
bincode.workspace = true
toml.workspace = true
cpp_demangle.workspace = true
inventory.workspace = true
log.workspace = true
rustc-hash.workspace = true
pollster.workspace = true
# Pure-function emulation in constant propagation runs the callee body.
qcode_emulator.workspace = true

[build-dependencies]
serde.workspace = true
bincode.workspace = true
# Parse the TEB/PEB layout from `src/teb.h` at build time (same libclang dep cabi uses).
clang.workspace = true

[dev-dependencies]
qcode = { workspace = true, features = ["testing"] }
qcode_macro.workspace = true
