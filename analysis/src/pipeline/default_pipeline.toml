# The canonical default analysis pipeline (the inner body the checkpoint+replay
# driver in `analyze_default` runs each round; the `assume_call_returns` /
# `verify_assumptions` steps that wrap it are the driver's job, not stages here).
#
# Each stage runs in order. A stage is `scope = "function"` (its passes run on
# every non-external function, function-major) or `scope = "module"` (its passes
# run once over the whole program). `repeat_until = "no_change"` loops a stage to
# a fixpoint — per function for function-scoped stages, whole-program for
# module-scoped ones. Function stages may set `only_dirty = true` to run only on
# functions changed by the previous stage; module changes are treated
# conservatively as dirtying all functions.
description = "Default whole-program lifting, discovery, optimization, and cleanup pipeline."

# --- Lifting phase (clean IR) ------------------------------------------------
# These stages run on the persistent clean-IR context (before the
# `code-discovery-fixpoint` barrier), and are inert when no lifter is injected
# (e.g. analyzing an already-lifted context). Recursive disassembly emerges from
# the fixpoint: `lift_new_addresses` lifts one block per discovered address and
# re-queues the addresses it reaches; jump-table targets resolved in the
# optimization phase are flowed back as discoveries and lifted next round.

# Seed the binary's entry points as discovered functions (and load its memory).
[[stage]]
name = "discover-binary"
scope = "module"
passes = ["discover_addresses_in_binary"]

# Establish the binary's real memory protections before lifting consults
# executability (verify-then-use), so the lifter narrows its permissive default
# (every readable byte is r/x) to the real section flags and skips data targets.
[[stage]]
name = "memory-protections"
scope = "module"
passes = ["memory_protections"]

# Drain the discovery queue to a fixpoint, lifting reachable code into clean IR.
[[stage]]
name = "lift"
scope = "module"
passes = ["lift_new_addresses"]
repeat_until = "no_change"

# Discover the glibc CRT `main` argument from the lifted primary entrypoint.
[[stage]]
name = "discover-crt-main"
scope = "module"
passes = ["discover_libc_main"]

# Let the normal recursive lifter own the discovered `main` function.
[[stage]]
name = "lift-crt-main"
scope = "module"
passes = ["lift_new_addresses"]
repeat_until = "no_change"

# Barrier: everything after this runs on the derived optimized IR. Unresolved
# indirect control-flow may remain; this only means the discovery loop has reached
# a fixpoint for the currently resolvable code.
[[stage]]
name = "code-discovery-fixpoint"
scope = "module"
passes = []

# --- Optimization phase (derived IR) -----------------------------------------

# Seed each function's call-clobbered-register set from the lifted IR before the
# value-producing passes consult it.
[[stage]]
name = "seed-clobbers"
scope = "module"
passes = ["seed_clobbers"]

# On Windows x86, type the FS_OFFSET segment-base register as PtrTo<TEB> (a global
# varnode-type override) before any pass turns register reads into params, so the
# promoted entry params (argpromote-registers, then mem2reg) inherit the type and
# the later `struct-typing` stage can unfold `fs:[…]` into named TEB/PEB fields. A
# no-op on any other platform (gated on the PE header via ArchConfig). A
# whole-program pass: it installs a single global varnode-type override, so it
# runs once module-wide rather than once per function.
[[stage]]
name = "windows-teb-seed"
scope = "module"
passes = ["windows_teb_seed"]

# Functionalize register side effects while register load/stores are still
# explicit. This mints the by-value `@SP` param (origin = the stack-pointer
# register) and seeds `store(@SP, RSP)` at entry, giving stack arithmetic a
# symbolic root to forward onto.
[[stage]]
name = "argpromote-registers"
scope = "module"
passes = ["argpromote_registers"]

# Resolve arguments at calls to bodyless external (imported) functions from their
# cabi C prototype, while register/stack accesses are still explicit (like
# argpromote-registers above): insert each argument's load just before the call —
# a register reload (System V) or an SP-relative stack load (32-bit stdcall, and
# System V overflow) — so the following promote/gvn forwards it onto the value the
# caller set up (a register write, or the push that wrote the stack slot).
[[stage]]
name = "external-args"
scope = "module"
passes = ["argpromote_external"]

# Promote to a fixpoint on the real incoming stack pointer `@SP` (no `@stack_base`
# round-trip). Each round: `canonicalize_sp_slots` unifies the per-site `@SP ± N`
# address instructions into one representative per offset; `mem2reg` forwards the
# entry `store(@SP, RSP)` seed (rewriting `RSP ± N` reads to `@SP ± N`) and
# promotes local frame slots (offset < 0) to SSA values; `const_fold` reassociates
# the exposed arithmetic. Convergence takes an extra round versus the literal
# model: round 1 forwards `RSP → @SP`, round 2 canonicalizes and promotes the now
# `@SP`-rooted slots. Incoming caller-frame stack arguments (offset >= 0) are left
# as `load(@SP + offset)` memory reads for the `argpromote` memory channel to
# functionalize, rather than being minted as stack-input params here.
[[stage]]
name = "promote"
scope = "function"
passes = ["canonicalize_sp_slots", "mem2reg", "const_fold"]
repeat_until = "no_change"

# Witness each function's memory-write space set now that `argpromote-registers`
# has functionalized callees (moving their register/stack effects into private
# scratch spaces and returned write-sets). GVN's store-to-load forwarding consults
# this so a value spilled into the caller's frame survives a call to a callee that
# provably never writes the spill's space — e.g. a `pure_reg` helper that only
# touches its own scratch space, not the real `ram` the spill lives in.
[[stage]]
name = "seed-written-spaces"
scope = "module"
passes = ["seed_written_spaces"]

[[stage]]
name = "gvn"
scope = "function"
passes = ["gvn"]

# Recover named struct-field accesses now that gvn has canonicalized
# `base + const` into a single expression: rewrite seeded segment/struct-pointer
# arithmetic into typed `gep`s and propagate field types through loads. A no-op
# unless something (e.g. `windows-teb-seed`) installed a struct-pointer type.
[[stage]]
name = "struct-typing"
scope = "function"
passes = ["struct_typing"]

# Resolve jump tables now that gvn has const-folded the dispatch address into the
# recognizable `table_base + index*scale` + load shape, so the indirect branch
# gains real CFG successors before the binding and cleanup stages run.
# Module-scoped because it is interprocedural: it queues cross-function code
# discoveries and re-homes resolved target blocks into their owning functions.
[[stage]]
name = "jump-tables"
scope = "module"
passes = ["handle_jump_tables"]

# Simplify so the lifter's straight-line goto-chains are merged into single
# blocks: the binder forwards each call's argument loads to the reaching
# arg-setup store via gvn's intra-block forwarding, so store and call must share
# a block.
[[stage]]
name = "simplify-cfg"
scope = "function"
passes = ["simplify_cfg"]

# Recognize small, trivially-bounded loops after CFG simplification has exposed
# the header/body/back-edge shape. Then restrict unrolling and cleanup to the
# functions that recognition annotated; the follow-up optimizer only runs where
# unroll/simplify actually rewrote IR.
[[stage]]
name = "loop-recognition"
scope = "function"
passes = ["recognize_simple_loops"]

[[stage]]
name = "loop-unroll-cleanup"
scope = "function"
passes = ["unroll_simple_loops", "simplify_cfg"]
only_dirty = true

[[stage]]
name = "post-loop-opt"
scope = "function"
passes = ["gvn", "dce"]
repeat_until = "no_change"
only_dirty = true

# Hoist loop-invariant computations into each loop's preheader, so values that do
# not change across iterations are computed once. Runs over every function (not
# just unrolled ones — large loops the unroller skips benefit most), after `gvn`
# has canonicalized pointer arithmetic so the alias oracle sees per-slot stack
# locations and constant-address globals. The follow-up `gvn`/`dce` fold and
# sweep the hoisted code; the trio loops to a fixpoint.
[[stage]]
name = "licm"
scope = "function"
passes = ["licm", "gvn", "dce"]
repeat_until = "no_change"

# Interprocedural signature milestones, whole-program, after every function is
# post-mem2reg/gvn but *before* the eliminating passes. `external_sigs` assigns
# conventional ABI signatures to imported/unresolved callees and `summaries`
# computes each function's input/clobber/stack-delta summary; both feed the
# downstream `dead_signature`, `partial_inline`, `mark_pure`, and `argpromote`
# stages. (The legacy `bind_args` register-ABI binder has been removed: register
# inputs are threaded by `argpromote_registers` and stack/memory inputs are
# functionalized by `argpromote`, so call sites no longer need a separate
# argument-load binding pass.)
[[stage]]
name = "signatures"
scope = "module"
passes = ["external_sigs", "summaries"]

# Eliminating passes, per function: drop the now-dead arg-setup stores and loads.
# The stack pointer keeps its real `@SP`-rooted arithmetic throughout (the legacy
# `brighten`/`lower_stack` `@stack_base` round-trip has been removed), so no
# stack-lowering stage is needed here.
[[stage]]
name = "post-bind"
scope = "function"
passes = ["dead_store", "dce"]

# Assume each function's incoming pointer args are disjoint from its own
# caller-frame slots, so the frame-freshness alias rule can forward a caller-frame
# slot load across a store through an incoming pointer (the spilled-pointer reload
# idiom argpromote relies on). Must run here, not in the pre-pipeline driver: the
# `@SP` param it keys on is minted by the earlier `argpromote-registers`/`promote`
# stages, so it does not exist before the pipeline runs. Recorded fresh each round;
# verified (and rolled back on a proven collision) after the round.
[[stage]]
name = "assume-arg-frame"
scope = "module"
passes = ["assume_arg_frame"]

# Functionalize memory side effects: rewrite a callee that mutates memory through
# pointer params to operate on a private shadow copy and return its writes as a
# `(address, value)` write-set, replayed at every caller. Runs once, late: it
# needs bound call sites and the final lowered body, and rewrites callee + every
# caller in one shot.
[[stage]]
name = "argpromote"
scope = "module"
passes = ["argpromote"]

# Sweep the instructions the rewrite makes dead (redirected/forwarded loads and
# stores, now-unused address computations): `dead_store` drops the now-unread
# stores, `dce` the forwarded loads and dead address math. A leading `dce` (the
# stage was once `dce, dead_store, dce`) is unnecessary — the only stage between
# here and the downstream `mark-pure`/`final-canonicalize` sweeps is
# `dead-signature`, which keys on call signatures rather than dead address math,
# so anything an up-front `dce` would remove is re-swept later with identical
# output.
[[stage]]
name = "argpromote-cleanup"
scope = "function"
passes = ["dead_store", "dce"]

# Now that callees are functionalized and the dead replay stores/extracts are
# swept, simplify the functionalized signatures, rewriting every direct call site.
# Both passes are module-scoped (they edit call sites across functions) and looped
# together to a whole-program fixpoint:
#   * `partial_inline` recomputes a callee's cheap outputs (a small pure
#     expression of its inputs) at every caller and kills the projecting extract,
#     leaving the returned field unprojected;
#   * `dead_signature` then drops arguments no callee reads and returned write-set
#     fields no caller projects, and DCEs the functions it dirties.
# A field one pass exposes can feed the other, so they share the loop.
[[stage]]
name = "dead-signature"
scope = "module"
passes = ["partial_inline", "dead_signature"]
repeat_until = "no_change"

# Forward the `argpromote` shadow seed-store/load pairs (by-value arguments stored
# into the shadow space at entry and read back as narrow loads) into their
# by-value params, so the purity check below sees a load-free body.
# `dead_store`+`dce` then sweep the now-unread seed stores.
[[stage]]
name = "pre-pure-cleanup"
scope = "function"
passes = ["gvn", "dead_store", "dce"]

# Purify to a whole-program fixpoint by interleaving marking, pure-call folding,
# and re-promotion — a function's purity can unlock its callers'. Each round:
#   * `mark_pure` asserts `is_pure` on functions whose returns are now a
#     deterministic function of their params (a pure call to an already-pure
#     callee is permitted, so a caller settles once its callees are flagged);
#   * `module(gvn)` folds/canonicalizes and `concretize` emulates those pure
#     callees at constant-argument call sites, replacing the projecting `extract`
#     with the computed literal — which can turn a previously call-derived address
#     (e.g. a deobfuscated `FS:<canary>` offset) into a constant, and forwards
#     argpromote's shadow seeds into the loads that read them back (`concretize`
#     is the module home of gvn's three pure-callee body-reading sub-passes);
#   * `module(dce)` / `module(dead_store)` sweep the folded extracts, now-dead
#     calls, and unread shadow stores;
#   * `argpromote` then re-runs: with the address now constant, the load it had to
#     skip last round becomes a by-value argument, functionalizing one more memory
#     channel and feeding the next round's `mark_pure`.
# `argpromote` is idempotent (it skips shadow-space accesses), `is_pure` only ever
# grows, and folding only removes work, so the round count is bounded.
[[stage]]
name = "mark-pure"
scope = "module"
passes = ["mark_pure", "module(gvn)", "concretize", "module(dce)", "module(dead_store)", "assume_arg_frame", "argpromote"]
repeat_until = "no_change"

# Promote bounded memory regions in pure functions to first-class array values so
# the fold recognizers below see the canonical carried-array form. `array_promote`
# rewrites the canonical fill/scan loop `argpromote` left as a region snapshot into
# a single loop-carried array (`insert`/`at`); `array_reads` rewrites a read-only
# snapshot (a NUL scan) to direct `at(arr, i)` reads; then `gvn`/`dce`/`dead_store`
# coalesce the trivial pass-through params and sweep the now-dead region
# loads/stores (including the unread wide temp store of a private shadow region,
# which the map matcher's "no RAM store consumer" arm relies on).
[[stage]]
name = "array-promote"
scope = "function"
passes = ["array_promote", "array_reads", "gvn", "dce", "dead_store"]

# Fold the promoted carried-array loops, per function. `loop_to_scan` folds
# accumulator scans (a lane-0 seed insert + `at(arr, i-1)` carry) to `scanl`;
# `loop_to_map` folds the seedless element-wise maps to `map` (outlining the
# per-element body into a fresh minted pure function); `strlen` folds the read-only
# NUL scans to `len(take_while(arr))` (both the `at`-form snapshot and the
# raw-`char*` layer). The three recognizers are mutually exclusive on any one
# function (seed insert present → scan; seedless carry insert → map; sole `at` NUL
# scan / no snapshot → strlen), so folding them into one per-function stage
# preserves semantics regardless of order. Runs after `mark-pure`/`array-promote`
# because they only consider `is_pure` callees. As `FunctionPass` passes they run
# over checked-out bodies (and in parallel when the worklist is large enough); the
# outliners return detached per-element bodies for ordered barrier installation.
[[stage]]
name = "loop-fold"
scope = "function"
passes = ["loop_to_scan", "loop_to_map", "strlen"]

# Project the `Extract`/`Range`-of-`map` back to a `body(k, in[k])` element at the
# caller now that the loops are folded. `concretize` is the module home of gvn's
# three pure-callee body-reading sub-passes (a function pass may not read another
# function's body); `final-canonicalize`'s `gvn` then folds the inlined bodies.
[[stage]]
name = "loop-fold-project"
scope = "module"
passes = ["concretize"]

# Infer per-parameter `readonly` / `nocapture` pointer attributes bottom-up over
# the now-functionalized (`pure_reg`) functions, whose positional arguments align
# with their root params by construction. Runs before `final-canonicalize` so the
# `gvn` there (via its `mem_forward` call-kill) stops treating a read-only passed
# pointer as clobbering the cells it reaches — unblocking store→load forwarding
# across calls like `strlen(&local)`. (Step 8 adds the frame-freshness consumer.)
# Externs
# already carry their C-prototype `readonly` bit from `external_sigs`; this fills
# in the bodies. Module-scoped: it is a whole-program fixpoint.
[[stage]]
name = "param-attrs"
scope = "module"
passes = ["param_attrs"]

# Aesthetic changes. `include_external` so the demangler also reaches imported
# library functions (PLT stubs like `_ZNSsixEj` -> `std::string::operator[]`),
# which are bodyless and therefore skipped by function-scoped stages by default.
# `cpp_demangle` gives bodyless imports their real names (so `include_external`);
# `name_thunks` then labels each single-jump stub `thunk_<callee>`.
# Re-canonicalize after the late binding passes. argpromote/dead_signature reshape
# call sites, leaving un-reassociated stack arithmetic (`((rsp-0x10)-0xc)+4+0xc`)
# on the `@SP`-rooted slots. gvn last ran before all of that, so a final pass folds
# these chains into single `@SP - N` slots (and CSEs them against the prologue's
# slots). DCE clears the arithmetic this makes dead.
#
# `gvn` here also forwards the argpromote shadow stores into the loads that read
# them back (e.g. into the returned write-set `pack`), which `dce` then deletes —
# leaving the shadow stores with no remaining reader. That forwarding happens
# only at this late point, after argpromote-cleanup's own `dead_store` has run,
# so a final `dead_store` is needed to sweep the now-unread temp-space stores
# (`unread_temp_space_stores`); the `dce` clears the address arithmetic the
# removed stores (and forwarded loads) leave behind.
# Repeat to a fixpoint: this both drives the store→load forwarding chain
# (forwarding a partially-overlapping store — e.g. a byte overwrite of a wider
# word — exposes a constant the next round folds, exposing further forwarding;
# a single pass leaves a byte-by-byte-assembled constant only partly reduced)
# *and* sequences the sweep: a `dead_store` that sees a forwarded-but-not-yet-
# swept load still counting as a reader simply removes that store on the next
# iteration, once `dce` has deleted the load — so no intra-iteration `dce`
# before `dead_store` is needed.
[[stage]]
name = "final-canonicalize"
scope = "function"
passes = ["gvn", "dead_store", "dce"]
repeat_until = "no_change"

# Second struct-typing pass: the early one (above) runs right after the first
# `gvn`, before late forwarding has assembled offsets built from overlapping
# partial stores into single constants. Now that `final-canonicalize` has folded
# those into the canonical `base + const` shape, recover the remaining
# segment/struct-pointer field accesses (e.g. an `fs:[0x30]` whose offset was
# only foldable this late) into named `gep`s.
[[stage]]
name = "struct-typing-late"
scope = "function"
passes = ["struct_typing"]

[[stage]]
name = "demangle"
scope = "function"
passes = ["cpp_demangle"]
include_external = true

# Stage barrier: `name_thunks` reads the callee's published interface name, so
# every demangle rename must be replayed before any thunk derives its name. This
# also keeps sequential and parallel execution byte-identical.
[[stage]]
name = "name-thunks"
scope = "function"
passes = ["name_thunks"]
include_external = true
