[package]
name = "qcode_emulator"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Concrete interpreter and emulator for the qcode IR"
readme = "readme.md"
documentation = "https://docs.rs/qcode_emulator"
keywords = ["binary-analysis", "emulator", "interpreter", "pcode", "reverse-engineering"]
categories = ["development-tools::debugging", "emulators"]
repository.workspace = true
homepage.workspace = true

[dependencies]
qcode.workspace = true
# Fast, non-cryptographic hasher for the emulator's hot maps (memory is keyed
# by u64 address; the std SipHash default dominated profiles). FxHash is the
# right tradeoff for trusted, integer-keyed lookups.
rustc-hash.workspace = true
rustc_apfloat.workspace = true

[dev-dependencies]
wazabin-qcode-macro.workspace = true
