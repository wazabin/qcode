[package]
name = "qcode_jit"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Cranelift JIT backend for the qcode IR: an alternative execution strategy to the interpreter"
repository.workspace = true

[dependencies]
qcode.workspace = true
qcode_emulator.workspace = true
qcode_vm.workspace = true
rustc-hash.workspace = true
cranelift = "0.129"
cranelift-jit = "0.129"
cranelift-module = "0.129"
cranelift-native = "0.129"

[dev-dependencies]
wazabin-qcode-macro.workspace = true
wazabin-qcode-sleigh = { version = "0.1.0", path = "../sleigh" }
sleigh-precompile = { package = "wazabin-sleigh-precompile", version = "0.1.1", path = "../../wazabin-sleigh/precompile" }
