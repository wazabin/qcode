[package]
name = "wazabin-qcode-jit"
edition.workspace = true
# Higher than the workspace floor: cranelift 0.129 requires 1.91.
rust-version = "1.91"
version.workspace = true
license.workspace = true
description = "Cranelift JIT backend for the qcode IR: an alternative execution strategy to the interpreter"
readme = "readme.md"
documentation = "https://docs.rs/wazabin-qcode-jit"
keywords = ["binary-analysis", "cranelift", "emulator", "jit", "reverse-engineering"]
categories = ["development-tools::debugging", "emulators"]
repository.workspace = true
homepage.workspace = true

[lib]
name = "qcode_jit"

[dependencies]
qcode.workspace = true
qcode_emulator.workspace = true
qcode_vm.workspace = true
rustc-hash.workspace = true
cranelift = "0.129"
cranelift-jit = "0.129"
cranelift-module = "0.129"
cranelift-native = "0.129"

[dev-dependencies]
wazabin-qcode-macro.workspace = true
wazabin-qcode-sleigh = { version = "0.2.0", path = "../sleigh" }
sleigh-precompile = { package = "wazabin-sleigh-precompile", version = "0.1.2", path = "../../wazabin-sleigh/precompile" }
sleigh = { package = "wazabin-sleigh", version = "0.1.2", path = "../../wazabin-sleigh/core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "qcode-run"
