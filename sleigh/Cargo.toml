[package]
name = "wazabin-qcode-sleigh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-performance lifting of wazabin-sleigh flat p-code into QCode"
readme = "README.md"
documentation = "https://docs.rs/wazabin-qcode-sleigh"
keywords = ["binary-analysis", "ghidra", "pcode", "reverse-engineering", "sleigh"]
categories = ["development-tools::debugging", "compilers"]

[dependencies]
jstd.workspace = true
qcode.workspace = true
rustc-hash.workspace = true
sleigh = { package = "wazabin-sleigh", version = "0.1.0", path = "../../wazabin-sleigh/core" }

[[example]]
name = "qcode-dump"
path = "examples/qcode_dump.rs"

[dev-dependencies]
qcode_emulator.workspace = true
sleigh-precompile = { path = "../../wazabin-sleigh/precompile" }
serde.workspace = true
serde_json = "1"
indicatif = "0.18"
postgres = "0.19"
csv = "1"
