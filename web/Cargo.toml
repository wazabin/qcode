[package]
name = "qcode-web"
version = "0.0.0"
edition = "2024"
publish = false
description = "x86-64 to QCode lifter for the language reference playground, deployed at wazabin.github.io/qcode"

# Standalone: keeps the published crates' Cargo.lock free of wasm-bindgen.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
qcode = { package = "wazabin-qcode", path = "../core" }
wazabin-qcode-sleigh = { path = "../sleigh" }
sleigh = { package = "wazabin-sleigh", version = "0.1.7", path = "../../wazabin-sleigh/core" }
sleigh-precompile = { package = "wazabin-sleigh-precompile", version = "0.1.7", path = "../../wazabin-sleigh/precompile" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
